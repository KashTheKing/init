[package]
name = "kashtheking/init"
version = "1.0.0"
description = "A module loader for Roblox games: point it at folders and it requires, initializes and starts every module in order, with OnPlayerAdded, OnHeartbeat and friends wired up for you."
license = "MIT"
authors = ["KashTheKing"]
homepage = "https://kashtheking.com/init/"
repository = "https://github.com/KashTheKing/init"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
include = ["src", "src/**", "default.project.json", "wally.toml", "LICENSE", "README.md"]

[dependencies]
