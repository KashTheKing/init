# The packages the plugin's "Add Packages" button copies into a game.
# Run `wally install` in this folder before building the plugin.
[package]
name = "kashtheking/init-framework-plugin"
version = "0.0.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
private = true

[dependencies]
Binder = "kashtheking/binder@0.6.3"
Packet = "kashtheking/packet@1.0.0"
Signal = "sleitnick/signal@2.0.3"
Trove = "sleitnick/trove@1.8.0"
