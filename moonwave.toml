[home]
enabled = true
includeReadme = true

[[home.features]]
title = "No code to set up"
description = "Install the Init Framework plugin, press Setup, and your game has a loader, boot scripts and folders. Add modules with one click from templates."

[[home.features]]
title = "Made for AI"
description = "An AI skill, copy-paste prompts and raw templates let Claude, Cursor or ChatGPT install Init and write modules the right way."

[[home.features]]
title = "Predictable startup"
description = "Folders load in the order you list them. Every Init runs before any Start, and OnPlayerAdded, Step, OnCharacterAdded and friends are wired up for you."

