[docusaurus]
url = "https://kashtheking.com"
baseUrl = "/init/"
organizationName = "KashTheKing"
projectName = "init"
tagline = "A module loader for Roblox games. Drop modules in folders; Init loads, initializes and starts them in order."
favicon = "img/favicon.svg"
trailingSlash = true
onBrokenAnchors = "ignore"

[navbar]
title = "Init"

[navbar.logo]
